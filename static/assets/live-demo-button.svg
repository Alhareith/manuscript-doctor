  </defs>
  <rect x="10" y="10" width="700" height="98" rx="22" fill="url(#button)" stroke="#e8bd55" stroke-width="3" filter="url(#shadow)"/>
  <path d="M32 30h656" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="78" cy="59" r="27" fill="#f7d77d"/>
  <path d="M78 43v23m0 0-9-9m9 9 9-9M66 73h24" fill="none" stroke="#075848" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="385" y="58" text-anchor="middle" direction="rtl" fill="#fffdf2" font-family="Tahoma, Arial, sans-serif" font-size="29" font-weight="700">جرّب الموقع الحي الآن</text>
  <text x="385" y="85" text-anchor="middle" direction="rtl" fill="#d9f1e7" font-family="Tahoma, Arial, sans-serif" font-size="16">افتح Manuscript Doctor واستكشف المعالجة مباشرة</text>
  <rect x="532" y="42" width="142" height="34" rx="17" fill="url(#shine)"/>
