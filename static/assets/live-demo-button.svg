<svg xmlns="http://www.w3.org/2000/svg" width="720" height="118" viewBox="0 0 720 118" role="img" aria-labelledby="title desc">
  <title id="title">جرّب الموقع الحي الآن</title>
  <desc id="desc">زر يفتح النسخة المنشورة من Manuscript Doctor</desc>
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27383b"/>
      <stop offset="0.26" stop-color="#718084"/>
      <stop offset="0.5" stop-color="#34474a"/>
      <stop offset="0.74" stop-color="#9aa7a8"/>
      <stop offset="1" stop-color="#1b292c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7983d"/>
      <stop offset="0.5" stop-color="#ffe6a0"/>
      <stop offset="1" stop-color="#a97527"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b7"/>
      <stop offset="1" stop-color="#c38d2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#123d35" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="700" height="98" rx="22" fill="url(#button)" stroke="#e6bd62" stroke-width="3" filter="url(#shadow)"/>
  <path d="M32 30h656" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="78" cy="59" r="27" fill="url(#icon)" stroke="#fff0b2" stroke-width="1"/>
  <path d="M72 46l18 13-18 13z" fill="#263b3d"/>
  <path d="M96 48c4 4 6 8 6 12s-2 8-6 12" fill="none" stroke="#fff5c9" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <text x="385" y="58" text-anchor="middle" direction="rtl" fill="#fffdf2" font-family="Tahoma, Arial, sans-serif" font-size="29" font-weight="700">جرّب الموقع الحي الآن</text>
  <text x="385" y="85" text-anchor="middle" direction="rtl" fill="#eef4f1" font-family="Tahoma, Arial, sans-serif" font-size="16">افتح Manuscript Doctor واستكشف المعالجة مباشرة</text>
  <rect x="532" y="42" width="142" height="34" rx="17" fill="url(#shine)"/>
  <text x="603" y="65" text-anchor="middle" direction="rtl" fill="#174b3d" font-family="Tahoma, Arial, sans-serif" font-size="15" font-weight="700">فتح التطبيق</text>
