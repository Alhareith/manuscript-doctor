<svg xmlns="http://www.w3.org/2000/svg" width="720" height="118" viewBox="0 0 720 118" role="img" aria-labelledby="title desc">
  <title id="title">جرّب الموقع الحي الآن</title>
  <desc id="desc">زر يفتح النسخة المنشورة من Manuscript Doctor</desc>
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8b70"/>
      <stop offset="0.55" stop-color="#0b6e59"/>
      <stop offset="1" stop-color="#064b40"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4c866"/>
      <stop offset="1" stop-color="#ffe8a8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#123d35" flood-opacity="0.25"/>
