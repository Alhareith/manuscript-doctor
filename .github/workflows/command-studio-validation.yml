name: command-studio-validation

on:
  push:
    branches:
      - design/premium-command-studio
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Static validation
        run: |
          python -m compileall processing app.py
          node --check static/js/parts/05-manual-parameters.js
          node --check static/js/parts/06-manual-preview.js
          node --check static/js/parts/07-manual-execution.js
          node --check static/js/parts/20-crop-editor-performance.js
          node --check static/js/parts/21-command-studio-layout.js
          node --check static/js/parts/22-reference-fidelity.js
          node --check static/js/parts/23-demo-hardening.js

      - name: Python regression suite
        run: python -m pytest -q

      - name: Start Flask
        run: |
          python -m flask --app app run --host 127.0.0.1 --port 5002 > /tmp/manuscript-flask.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:5002/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/manuscript-flask.log
          exit 1

      - name: Validate premium command studio in Chromium
        run: python tools/check_command_studio.py --url http://127.0.0.1:5002 --output command-studio-artifact

      - name: Upload visual validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-studio-validation
          path: command-studio-artifact
          if-no-files-found: warn
