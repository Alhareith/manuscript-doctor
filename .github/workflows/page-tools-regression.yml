name: Page Tools Regression

on:
  push:
    branches:
      - experiment/textline-mesh-dewarping
  workflow_dispatch:

jobs:
  page-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile app.py
          python -m compileall -q processing

      - name: Check page tools JavaScript syntax
        run: |
          node --check static/js/parts/02-upload-api.js
          node --check static/js/parts/04-examination.js
          node --check static/js/parts/05-manual-parameters.js
          node --check static/js/parts/06-manual-preview.js
          node --check static/js/parts/07-manual-execution.js
          node --check static/js/parts/10-theme-quick-tools.js
          node --check static/js/parts/20-crop-editor-performance.js
          node --check static/js/workers/instant-examination-worker.js

      - name: Report real-image preparation diagnostics
        run: |
          python tools/page_tools_diagnostics.py

      - name: Run page preparation regression tests
        run: |
          python -m pytest -q \
            tests/test_page_tools_regression.py \
            tests/test_crop_operations.py \
            tests/test_orientation_operations.py \
            tests/test_orientation_api.py \
            tests/test_preparation_pipeline.py \
            tests/test_preparation_verification.py \
            tests/test_dewarp_experiment_integration.py
