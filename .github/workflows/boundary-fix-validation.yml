name: boundary-fix-validation

on:
  push:
    branches:
      - fix/hybrid-boundary-preview-source

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall processing app.py
      - run: |
          for file in static/js/parts/*.js; do
            node --check "$file"
          done
      - run: pytest -q
