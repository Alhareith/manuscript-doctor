    <!-- ===================== الهيدر المضغوط ===================== -->
    <header class="app-header">
        <div class="container-fluid app-header-inner">
            <a class="app-brand" href="#workspace" aria-label="طبيب الوثائق — الانتقال إلى مساحة العمل">
                <span class="brand-mark" aria-hidden="true"><img src="{{ url_for('static', filename='assets/doctor-logo.svg') }}" alt=""></span>
                <span class="brand-copy">
                    <strong>طبيب الوثائق</strong>
                    <small>شخّص ← عالج ← حافظ ← تحقق</small>
                </span>
            </a>

            <div class="header-actions">
                <button id="themeToggleButton" class="theme-toggle" type="button" aria-label="تفعيل الوضع الليلي" aria-pressed="false">
                    <i class="bi bi-moon-stars-fill theme-toggle-icon"></i>
                    <span class="theme-toggle-label">الوضع الليلي</span>
                </button>

        <div class="container-fluid workflow-panel">
            <ol class="workflow-list">
                <li class="workflow-item is-current" data-workflow-step="upload"><a href="#uploadSection" data-workflow-nav aria-label="الانتقال إلى رفع الوثيقة"><span>01</span><strong>رفع</strong></a></li>
                <li class="workflow-item" data-workflow-step="prepare"><a href="#documentPreviewSection" data-workflow-nav aria-label="الانتقال إلى معاينة الوثيقة"><span>02</span><strong>تهيئة</strong></a></li>
                <li class="workflow-item" data-workflow-step="diagnose"><a href="#examinationSection" data-workflow-nav aria-label="الانتقال إلى فحص الوثيقة"><span>03</span><strong>تشخيص</strong></a></li>
                <li class="workflow-item" data-workflow-step="treat"><a href="#treatmentSection" data-workflow-nav aria-label="الانتقال إلى المعالجة"><span>04</span><strong>معالجة</strong></a></li>
